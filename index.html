<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>AB Forge V1</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:white;padding:20px}h1{margin:0}main{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}textarea,input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:7px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;margin-top:10px}.cmd{min-height:110px}.log{background:#0f172a;color:#dbeafe;border-radius:12px;padding:12px;white-space:pre-wrap;min-height:100px}.step{padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-top:8px}.muted{color:#64748b;font-size:13px}</style></head><body><header><h1>⚡ AB Forge</h1><div class="muted" style="color:#cbd5e1">AI Builder System • V1 Foundation</div></header><main><section class="card"><h2>🎙️ Command</h2><textarea id="command" class="cmd" placeholder="Example: Build me a restaurant website"></textarea><button onclick="run()">Run Command</button></section><section class="card"><h2>🧠 Agent Plan</h2><div id="plan"><div class="muted">Your plan will appear here.</div></div></section><section class="card"><h2>📟 Agent Log</h2><div id="log" class="log">Ready.</div></section><section class="card"><h2>🧩 Tools</h2><div class="step">💻 Code Builder — foundation</div><div class="step">🧪 Tester/Fixer — foundation</div><div class="step">💾 Project Memory — local browser storage</div><div class="step">🔌 Tool Registry — ready for future connectors</div></section></main><script>const $=id=>document.getElementById(id);function run(){const c=$("command").value.trim();if(!c){alert("Command likho pehla.");return}const steps=["Understand command","Create project plan","Select required tools","Generate project files","Test and check","Prepare output"];$("plan").innerHTML=steps.map((s,i)=>`<div class="step"><b>${i+1}.</b> ${s}</div>`).join('');let i=0;$("log").textContent="Command received: "+c+"\n";const t=setInterval(()=>{if(i>=steps.length){clearInterval(t);$("log").textContent+="\n✅ V1 planning complete. Real AI/tool execution will be connected in the next layer.";localStorage.setItem('lastCommand',c);return}$("log").textContent+=`→ ${steps[i]}\n`;i++},350)}</script></body></html>
